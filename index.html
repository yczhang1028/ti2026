<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TI2026 小组赛战报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#070a12; --bg1:#0c111c; --card:#121a2a; --card2:#162034;
  --border:#1f2a40; --border2:#2c3a58;
  --text:#e9edf5; --dim:#8b95a8; --dim2:#5b6578;
  --gold:#e8b34b; --gold2:#d4a53c; --gold3:#f5d489;
  --red:#ff4d4f; --green:#34d399; --blue:#4da3ff;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg0); color:var(--text);
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  line-height:1.55; min-height:100vh; }

/* ===== HERO ===== */
.hero { position:relative; overflow:hidden; min-height:400px; display:flex; align-items:flex-end;
  border-bottom:1px solid var(--border2); }
.hero-bg { position:absolute; inset:0; background:url('bg.jpg') center/cover no-repeat; filter:saturate(1.05); }
.hero-overlay { position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(7,10,18,0.5) 0%, rgba(7,10,18,0.3) 40%, rgba(7,10,18,0.94) 100%),
             linear-gradient(90deg, rgba(7,10,18,0.88) 0%, rgba(7,10,18,0.35) 55%, rgba(7,10,18,0.05) 100%); }
.hero-content { position:relative; z-index:2; width:100%; max-width:1800px; margin:0 auto; padding:48px 40px 30px; }
.hero-eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:4px;
  text-transform:uppercase; color:var(--gold); margin-bottom:12px; }
.hero-title { font-family:'Barlow Condensed',-apple-system,'PingFang SC',sans-serif;
  font-size:78px; font-weight:800; line-height:0.98; letter-spacing:1px;
  background:linear-gradient(115deg,#fff8e6 0%,#ffe9a8 18%,var(--gold3) 40%,var(--gold) 60%,#e09a2b 85%,var(--gold3) 100%);
  background-size:200% 100%; -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; text-transform:uppercase; animation:shine 5s ease-in-out infinite; }
@keyframes shine { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
.hero-title .cn { font-size:44px; -webkit-text-fill-color:var(--text); letter-spacing:3px; }
.hero-sub { display:flex; gap:16px; flex-wrap:wrap; margin-top:16px; color:var(--dim); font-size:13px; }
.hero-sub .dot { color:var(--dim2); }

/* ===== 统计带 ===== */
.statbar { width:100%; max-width:1800px; margin:0 auto; padding:0 40px; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border);
  border:1px solid var(--border); border-radius:0 0 12px 12px; overflow:hidden; }
@media (max-width:760px) { .stats { grid-template-columns:repeat(2,1fr); } }
.stat { background:var(--card); padding:20px 26px; }
.stat-num { font-family:'Barlow Condensed',sans-serif; font-size:36px; font-weight:800; color:var(--gold); line-height:1; }
.stat-label { color:var(--dim2); font-size:11px; letter-spacing:1px; text-transform:uppercase; margin-top:6px; }

/* ===== 主内容 ===== */
.wrap { max-width:1800px; margin:0 auto; padding:26px 40px 52px;
  display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:24px; align-items:start; }
@media (max-width:1100px) { .wrap { grid-template-columns:1fr; } }
.main-col, .side-col { display:flex; flex-direction:column; gap:24px; min-width:0; }

/* ===== 领跑横幅 ===== */
.leaders { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media (max-width:760px) { .leaders { grid-template-columns:1fr; } }
.leader-card { display:flex; align-items:center; gap:14px; padding:18px 16px;
  background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--border);
  border-radius:10px; position:relative; overflow:hidden; }
.leader-card::after { content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,var(--gold),transparent); opacity:0.7; }
.leader-medal { font-size:26px; }
.leader-logo { width:44px; height:44px; }
.leader-card .logo-ph { width:44px; height:44px; font-size:18px; }
.leader-name { font-weight:700; font-size:16px; }
.leader-rec { font-family:'JetBrains Mono',monospace; color:var(--gold); font-size:14px; margin-top:2px; }

/* ===== CARD ===== */
.card { position:relative; background:linear-gradient(180deg,var(--card2) 0%,var(--card) 100%);
  border:1px solid var(--border); border-radius:10px; padding:20px 22px; overflow:hidden; }
.card::before { content:""; position:absolute; top:0; left:0; width:3px; height:100%;
  background:linear-gradient(180deg,var(--gold),transparent 70%); }
.card-title { font-family:'Barlow Condensed',-apple-system,sans-serif; font-size:20px; font-weight:700;
  letter-spacing:0.5px; color:var(--gold); margin-bottom:14px; display:flex; align-items:center; gap:10px; }
.title-num { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--dim2);
  border:1px solid var(--border2); border-radius:4px; padding:2px 7px; }

/* ===== 图例 ===== */
.legend { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; font-size:12px; color:var(--dim); }
.lg-win { color:var(--green); }
.lg-lose { color:var(--red); }
.lg-tie { color:var(--gold); }
.lg-cn { color:var(--red); }

/* ===== Swiss 横向对阵表 ===== */
.table-scroll { overflow-x:auto; margin:0 -6px; padding:0 6px; }
table.swiss { width:100%; border-collapse:separate; border-spacing:0; min-width:720px; }
table.swiss th { text-align:left; padding:8px 8px; color:var(--dim2); font-size:11px; font-weight:500;
  letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid var(--border2); white-space:nowrap; }
table.swiss th.th-round { text-align:center; }
table.swiss td { padding:7px 8px; border-bottom:1px solid var(--border); font-size:14px; }
table.swiss tr:last-child td { border-bottom:none; }
tr.cn-row td { background:rgba(255,77,79,0.06); }
tr.cn-row td:first-child { box-shadow:inset 3px 0 0 var(--red); }
tr:hover td { background:rgba(255,255,255,0.025); }
.td-rank { width:44px; text-align:center; }
.rank-badge { display:inline-flex; width:26px; height:26px; align-items:center; justify-content:center;
  border-radius:6px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; }
.rank-gold { background:linear-gradient(135deg,#f5d489,#d4a53c); color:#3a2800; box-shadow:0 0 12px rgba(232,179,75,0.45); }
.rank-silver { background:linear-gradient(135deg,#dfe6f2,#9aa7bd); color:#2a3342; }
.rank-bronze { background:linear-gradient(135deg,#e8b587,#c07a3a); color:#3a2008; }
.rank-num { display:inline-flex; width:26px; height:26px; align-items:center; justify-content:center;
  color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:13px; }
.td-team { display:flex; align-items:center; gap:9px; white-space:nowrap; }
.logo { width:26px; height:26px; object-fit:contain; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
.logo-ph { display:inline-flex; width:26px; height:26px; align-items:center; justify-content:center;
  border-radius:50%; font-size:12px; font-weight:700; flex:none; color:#fff; }
.tname { font-weight:500; }
.cn-flag { font-size:12px; }
.td-score { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; font-weight:700; font-size:14px; white-space:nowrap; }
.td-score .dash { color:var(--dim2); margin:0 2px; }
.td-score.dim { color:var(--dim2); font-weight:500; }

.td-round { text-align:center; padding:4px 5px !important; }
.rc { display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:64px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); }
.rc-opp { font-size:12px; color:var(--dim); white-space:nowrap; max-width:90px; overflow:hidden; text-overflow:ellipsis; }
.rc-score { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; }
.rc-win { background:rgba(52,211,153,0.12); border-color:rgba(52,211,153,0.4); }
.rc-win .rc-score { color:var(--green); }
.rc-lose { background:rgba(255,77,79,0.10); border-color:rgba(255,77,79,0.35); }
.rc-lose .rc-score { color:var(--red); }
.rc-tie { background:rgba(232,179,75,0.10); border-color:rgba(232,179,75,0.35); }
.rc-tie .rc-score { color:var(--gold); }
.rc-pending { border-style:dashed; }
.rc-pending .rc-score { color:var(--gold); }
.rc-empty { color:var(--dim2); }

/* ===== 对阵卡片 ===== */
.match-card { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px;
  padding:14px 12px; border-bottom:1px solid var(--border); }
.match-card:last-child { border-bottom:none; }
.match-card.is-done { opacity:0.8; }
.mc-side { display:flex; align-items:center; gap:10px; }
.mc-side.right { justify-content:flex-end; flex-direction:row-reverse; }
.mc-logo { width:34px; height:34px; }
.mc-side .logo-ph { width:34px; height:34px; font-size:15px; }
.mc-team { font-weight:600; font-size:15px; }
.mc-mid { text-align:center; min-width:70px; }
.mc-time { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--dim2); margin-bottom:2px; }
.mc-vs { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:800; color:var(--dim); }
.mc-score { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--gold);
  text-shadow:0 0 14px rgba(232,179,75,0.4); }
.mc-score .dash { color:var(--dim2); }

/* ===== 昨日 match-row ===== */
.match-row { display:flex; align-items:center; gap:12px; padding:9px 2px; border-bottom:1px solid var(--border); }
.match-row:last-child { border-bottom:none; }
.match-score { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--gold);
  min-width:40px; text-shadow:0 0 14px rgba(232,179,75,0.35); }
.match-teams { font-size:14px; flex:1; }
.match-teams .vs { color:var(--dim2); font-size:12px; margin:0 4px; }
.match-win { color:var(--green); font-size:13px; font-weight:600; }

/* ===== 选手榜 ===== */
.prow { display:flex; align-items:center; gap:9px; padding:8px 2px; border-bottom:1px solid var(--border); font-size:14px; }
.prow:last-child { border-bottom:none; }
.p-rank { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); font-weight:700; width:16px; }
.pname { font-weight:600; }
.pval { font-family:'JetBrains Mono',monospace; color:var(--gold); font-weight:700; margin-left:auto;
  text-shadow:0 0 12px rgba(232,179,75,0.3); }
.punit { font-size:11px; color:var(--dim); }
.cntag { color:var(--red); font-size:11px; font-weight:700; }
.team-tag { display:inline-block; background:rgba(255,77,79,0.15); border:1px solid rgba(255,77,79,0.35);
  border-radius:4px; padding:0 5px; margin-right:2px; }

/* ===== 中国选手指标卡 ===== */
.pcard { padding:12px 2px; border-bottom:1px solid var(--border); }
.pcard:last-child { border-bottom:none; }
.pcard-head { display:flex; align-items:center; gap:8px; }
.pcard-name { font-weight:700; font-size:15px; }
.pcard-kda { font-family:'JetBrains Mono',monospace; color:var(--gold); font-weight:700; font-size:15px;
  margin-left:auto; text-shadow:0 0 12px rgba(232,179,75,0.3); }
.pcard-meta { color:var(--dim2); font-size:11px; margin:3px 0 8px; font-family:'JetBrains Mono',monospace; }
.pcard-stats { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.ps { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:6px;
  padding:7px 4px; text-align:center; }
.ps-num { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; color:var(--text); }
.ps-lbl { font-size:10px; color:var(--dim2); margin-top:2px; letter-spacing:0.5px; }

/* ===== ANALYSIS ===== */
.card-analysis { border-color:var(--gold2); }
.card-analysis::before { background:linear-gradient(180deg,var(--gold),var(--red) 100%); }
.analysis-body { font-size:14px; }
.analysis-body h3 { font-family:'Barlow Condensed',sans-serif; color:var(--text); font-size:16px;
  font-weight:700; margin:14px 0 7px; padding-left:8px; border-left:2px solid var(--red); }
.analysis-body h3:first-child { margin-top:0; }
.analysis-body p { margin:6px 0; }
.analysis-body ul { padding-left:20px; }
.analysis-body li { margin:5px 0; }
.analysis-body strong { color:var(--gold3); }
.analysis-body code { font-family:'JetBrains Mono',monospace; background:rgba(255,255,255,0.06);
  padding:1px 5px; border-radius:4px; font-size:12px; }

/* ===== MISC ===== */
.muted { color:var(--dim2); font-size:13px; padding:4px 0; }
.dim2 { color:var(--dim2); }
.footer { text-align:center; color:var(--dim2); font-size:11px; margin-top:26px;
  font-family:'JetBrains Mono',monospace; letter-spacing:1px; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="hero-eyebrow">The International 2026 · Shanghai</div>
    <h1 class="hero-title">TI2026 <span class="cn">小组赛战报</span></h1>
    <div class="hero-sub" id="heroSub"></div>
  </div>
</div>

<div class="statbar"><div class="stats" id="stats"></div></div>

<div class="wrap">
  <div class="main-col">
    <div class="leaders" id="leaders"></div>
    <section class="card">
      <h2 class="card-title"><span class="title-num">01</span>📊 积分榜 · Swiss 对阵</h2>
      <div class="legend"><span class="lg-win">■ 胜</span><span class="lg-lose">■ 负</span><span class="lg-tie">■ 平/未定</span><span class="lg-cn">🇨🇳 中国战队</span></div>
      <div class="table-scroll"><table class="swiss" id="swissTable"></table></div>
    </section>
    <section class="card">
      <h2 class="card-title"><span class="title-num">02</span>🗓️ 今日赛程</h2>
      <div id="todayMatches"></div>
    </section>
    <section class="card">
      <h2 class="card-title"><span class="title-num">03</span>📰 昨日战报</h2>
      <div id="yestMatches"></div>
    </section>
  </div>

  <div class="side-col">
    <section class="card card-analysis" id="analysisCard" style="display:none">
      <h2 class="card-title"><span class="title-num">04</span>🔍 形势分析</h2>
      <div class="analysis-body" id="analysisBody"></div>
    </section>
    <section class="card">
      <h2 class="card-title"><span class="title-num">05</span>⚔️ 场均击杀 TOP3</h2>
      <div id="killTop"></div>
    </section>
    <section class="card">
      <h2 class="card-title"><span class="title-num">06</span>🛡️ KDA TOP3</h2>
      <div id="kdaTop"></div>
    </section>
    <section class="card">
      <h2 class="card-title"><span class="title-num">07</span>🇨🇳 中国选手状态</h2>
      <div id="cnPlayers"></div>
    </section>
  </div>
</div>

<div class="footer">TI2026 · 上海 · 小组赛 8/13-8/16 · 淘汰赛 8/17-8/23</div>

<script>
/* ========== 常量 ========== */
const CN_TEAMS = {"Xtreme Gaming":"XG","Vici Gaming":"VG","Team Resilience":"TR"};
const CN_ROSTER = {
  "Xtreme Gaming":["Ame","NothingToSay","Xxs","fy","xNova"],
  "Vici Gaming":["shiro","Xm","Bach","XinQ","y`"],
  "Team Resilience":["Erika","Echo","niu","planet","zzq"]
};
const PLAYER_ALIAS = {"ysr-04e":"erika","echozz":"echo"};
const PLAYER_TEAM = {};
for (const [t,ps] of Object.entries(CN_ROSTER)) for (const p of ps) PLAYER_TEAM[p.toLowerCase()] = CN_TEAMS[t];
const CN_NAMES = {
  "Team Falcons":"Falcons","LGD Gaming":"LGD","Nigma Galaxy":"Nigma",
  "Iron Wing":"Iron Wing","BoomBoys":"BoomBoys","OG":"OG",
  "TEAM VISION":"Vision","Team Resilience":"Resilience",
  "Team Spirit":"Spirit","Xtreme Gaming":"Xtreme Gaming(XG)",
  "Team Liquid":"Liquid","Vici Gaming":"Vici Gaming(VG)",
  "Aurora Gaming":"Aurora","GamerLegion":"GamerLegion",
  "Team Yandex":"Yandex","HULIGANI":"HULIGANI"
};
const LOGO_COLORS = [["#e5484d"],["#3b82f6"],["#f59e0b"],["#22c55e"],["#a855f7"],["#06b6d4"],["#f97316"],["#ec4899"]];

/* ========== 工具 ========== */
const cn = n => CN_NAMES[n] || n;
const isCN = t => t in CN_TEAMS;
function playerIsCN(name){ let k=name.toLowerCase().trim(); if(k in PLAYER_ALIAS) k=PLAYER_ALIAS[k]; return k in PLAYER_TEAM; }
function playerTeam(name){ let k=name.toLowerCase().trim(); if(k in PLAYER_ALIAS) k=PLAYER_ALIAS[k]; return PLAYER_TEAM[k]||""; }
function kda(s){ return ((s.kills+s.assists)/(s.deaths||1)); }
function hash(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%100000; return h; }
function sanitizeFile(team){ return team.toLowerCase().replace(/ /g,"_").replace(/[()]/g,"").replace(/_+$/,""); }
function logoHTML(team, sizeCls, logoFile){
  const f = logoFile || (sanitizeFile(team)+".png");
  return `<img class="logo${sizeCls?" "+sizeCls:""}" src="logos/${f}" alt="" loading="lazy" onerror="logoFallback(this,'${team.replace(/'/g,"")}')">`;
}
function logoFallback(img, team){
  const span=document.createElement('span');
  span.className='logo-ph';
  span.style.background=LOGO_COLORS[hash(team)%LOGO_COLORS.length][0];
  span.textContent=(team[0]||'?').toUpperCase();
  img.replaceWith(span);
}
function rankBadge(r){
  if(r===1) return '<span class="rank-badge rank-gold">1</span>';
  if(r===2) return '<span class="rank-badge rank-silver">2</span>';
  if(r===3) return '<span class="rank-badge rank-bronze">3</span>';
  return `<span class="rank-num">${r}</span>`;
}
function mdToHtml(md){
  const lines=md.split("\n"); const out=[]; let inList=null;
  for(let raw of lines){
    let line=raw.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
    let m=line.match(/^(#{1,4})\s+(.*)$/);
    if(m){ if(inList){out.push(`</${inList}>`);inList=null;} const lv=m[1].length; out.push(`<h${lv}>${m[2]}</h${lv}>`); continue; }
    m=line.match(/^[-*]\s+(.*)$/);
    if(m){ if(inList!=="ul"){if(inList)out.push(`</${inList}>`);out.push("<ul>");inList="ul";} out.push(`<li>${m[1]}</li>`); continue; }
    m=line.match(/^\d+[.)]\s+(.*)$/);
    if(m){ if(inList!=="ol"){if(inList)out.push(`</${inList}>`);out.push("<ol>");inList="ol";} out.push(`<li>${m[1]}</li>`); continue; }
    if(!line.trim()){ if(inList){out.push(`</${inList}>`);inList=null;} continue; }
    if(inList){out.push(`</${inList}>`);inList=null;}
    out.push(`<p>${line}</p>`);
  }
  if(inList) out.push(`</${inList}>`);
  return out.join("\n");
}

/* ========== 渲染组件 ========== */
function renderHero(d){
  document.getElementById('heroSub').innerHTML =
    `<span>上海时间 ${d.now||""}</span><span class="dot">·</span><span>Swiss 制 · 5 轮 · Bo3</span><span class="dot">·</span><span>数据源 Liquipedia / OpenDota</span>`;
}
function renderStats(d){
  const st=d.standings||[]; const leaders=st.filter(s=>[1,2,3].includes(s.rank)).slice(0,3);
  const cnCount=st.filter(s=>isCN(s.team)).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-num">${st.length}</div><div class="stat-label">参赛战队</div></div>
    <div class="stat"><div class="stat-num">${(d.today||[]).length}</div><div class="stat-label">今日比赛</div></div>
    <div class="stat"><div class="stat-num">${cnCount}</div><div class="stat-label">中国战队</div></div>
    <div class="stat"><div class="stat-num">${leaders[0]?leaders[0].match:"—"}</div><div class="stat-label">领跑战绩</div></div>`;
}
function renderLeaders(d){
  const st=d.standings||[]; const leaders=st.filter(s=>[1,2,3].includes(s.rank)).slice(0,3);
  const medals=["🥇","🥈","🥉"];
  document.getElementById('leaders').innerHTML = leaders.map((s,i)=>`
    <div class="leader-card">
      <div class="leader-medal">${medals[i]}</div>
      ${logoHTML(s.team,"leader-logo",s.logo_file)}
      <div class="leader-info"><div class="leader-name">${cn(s.team)}${isCN(s.team)?' <span class="cn-flag">🇨🇳</span>':""}</div>
      <div class="leader-rec">${s.match}<span class="dim2"> / ${s.game}</span></div></div>
    </div>`).join("");
}
function renderStandings(d){
  const st=d.standings||[]; const cross=d.cross||{}; const rounds=cross.rounds||[]; const table=cross.table||{};
  const rh=rounds.map(r=>`<th class="th-round">${r.replace("Round ","R")}</th>`).join("");
  const rows=st.map(s=>{
    const cls=isCN(s.team)?' class="cn-row"':"";
    const tag=isCN(s.team)?' <span class="cn-flag">🇨🇳</span>':"";
    const cells=rounds.map(r=>{
      const c=(table[s.team]||{})[r];
      if(!c) return '<td class="td-round"><span class="rc-empty">—</span></td>';
      const state=c.my>c.op?"rc-win":(c.my<c.op?"rc-lose":(c.fin?"rc-tie":"rc-pending"));
      return `<td class="td-round"><div class="rc ${state}"><div class="rc-opp">${cn(c.opp)}</div><div class="rc-score">${c.my}-${c.op}</div></div></td>`;
    }).join("");
    const [mw,ml]=[...s.match.split("-"),"0"].slice(0,2);
    const [gw,gl]=[...s.game.split("-"),"0"].slice(0,2);
    return `<tr${cls}><td class="td-rank">${rankBadge(s.rank)}</td>
      <td class="td-team">${logoHTML(s.team,"",s.logo_file)}<span class="tname">${cn(s.team)}${tag}</span></td>
      <td class="td-score">${mw}<span class="dash">-</span>${ml}</td>
      <td class="td-score dim">${gw}<span class="dash">-</span>${gl}</td>${cells}</tr>`;
  }).join("");
  document.getElementById('swissTable').innerHTML =
    `<thead><tr><th>#</th><th>战队</th><th>大分</th><th>小分</th>${rh}</tr></thead><tbody>${rows}</tbody>`;
}
function renderToday(d){
  const today=d.today||[];
  if(!today.length){ document.getElementById('todayMatches').innerHTML='<div class="muted">今日无比赛</div>'; return; }
  document.getElementById('todayMatches').innerHTML = today.map(m=>{
    const t=m.date_raw||""; const hhmm=t.split(" - ").pop().split(" ")[0];
    const done=m.finished?' is-done':"";
    const center=m.finished?`<div class="mc-score">${m.t1_score}<span class="dash">:</span>${m.t2_score}</div>`:'<div class="mc-vs">VS</div>';
    const f1=isCN(m.t1)?'🔥':"", f2=isCN(m.t2)?'🔥':"";
    return `<div class="match-card${done}">
      <div class="mc-side">${logoHTML(m.t1,"mc-logo",m.logo1)}<span class="mc-team">${cn(m.t1)}${f1}</span></div>
      <div class="mc-mid"><div class="mc-time">${hhmm}</div>${center}</div>
      <div class="mc-side right">${logoHTML(m.t2,"mc-logo",m.logo2)}<span class="mc-team">${cn(m.t2)}${f2}</span></div>
    </div>`;}).join("");
}
function renderYest(d){
  const yest=d.yest_done||[];
  if(!yest.length){ document.getElementById('yestMatches').innerHTML='<div class="muted">暂无已结束比赛</div>'; return; }
  document.getElementById('yestMatches').innerHTML = yest.map(m=>{
    const win=m.t1_score>m.t2_score?cn(m.t1):cn(m.t2);
    const fire=(isCN(m.t1)||isCN(m.t2))?' <span class="fire">🔥</span>':"";
    return `<div class="match-row"><div class="match-score">${m.t1_score}-${m.t2_score}</div>
      <div class="match-teams">${cn(m.t1)} <span class="vs">vs</span> ${cn(m.t2)}</div>
      <div class="match-win">${win} 胜${fire}</div></div>`;}).join("");
}
function renderAnalysis(d){
  if(!d.analysis){ document.getElementById('analysisCard').style.display='none'; return; }
  document.getElementById('analysisCard').style.display='';
  document.getElementById('analysisBody').innerHTML=mdToHtml(d.analysis);
}
function renderPlayerTop(d){
  const ps=Object.values(d.player_stats||{});
  const multi=ps.filter(s=>s.games>=2);
  const kill=multi.sort((a,b)=>b.kills/b.games-a.kills/a.games).slice(0,3);
  const kdaT=multi.sort((a,b)=>kda(b)-kda(a)).slice(0,3);
  document.getElementById('killTop').innerHTML = kill.map((s,i)=>`
    <div class="prow"><span class="p-rank">${i+1}</span><span class="pname">${s.name}${playerIsCN(s.name)?` <span class="cntag">🇨🇳${playerTeam(s.name)}</span>`:""}</span>
    <span class="pval">${(s.kills/s.games).toFixed(1)}<span class="punit">K</span></span></div>`).join("");
  document.getElementById('kdaTop').innerHTML = kdaT.map((s,i)=>`
    <div class="prow"><span class="p-rank">${i+1}</span><span class="pname">${s.name}${playerIsCN(s.name)?` <span class="cntag">🇨🇳${playerTeam(s.name)}</span>`:""}</span>
    <span class="pval">${kda(s).toFixed(1)}</span></div>`).join("");
}
function renderCNPlayers(d){
  const ps=Object.values(d.player_stats||{}).filter(s=>playerIsCN(s.name));
  if(!ps.length){ document.getElementById('cnPlayers').innerHTML='<div class="muted">暂无中国选手比赛数据</div>'; return; }
  document.getElementById('cnPlayers').innerHTML = ps.sort((a,b)=>kda(b)-kda(a)).map(s=>{
    const team=playerTeam(s.name); const g=s.games;
    const av=(x)=>g?(x/g):0;
    return `<div class="pcard">
      <div class="pcard-head"><span class="cntag team-tag">[${team}]</span><span class="pcard-name">${s.name}</span>
      <span class="pcard-kda">KDA ${kda(s).toFixed(1)}</span></div>
      <div class="pcard-meta">${g}局 · ${s.kills}/${s.deaths}/${s.assists} · 胜率 ${(av(s.wins)*100).toFixed(0)}%</div>
      <div class="pcard-stats">
        <div class="ps"><div class="ps-num">${av(s.kills).toFixed(1)}</div><div class="ps-lbl">场均击杀</div></div>
        <div class="ps"><div class="ps-num">${av(s.gpm).toFixed(0)}</div><div class="ps-lbl">GPM</div></div>
        <div class="ps"><div class="ps-num">${av(s.xpm).toFixed(0)}</div><div class="ps-lbl">XPM</div></div>
        <div class="ps"><div class="ps-num">${av(s.lh).toFixed(0)}</div><div class="ps-lbl">补刀</div></div>
        <div class="ps"><div class="ps-num">${(av(s.hero_dmg)/1000).toFixed(1)}k</div><div class="ps-lbl">场均伤害</div></div>
      </div></div>`;}).join("");
}

/* ========== 加载 ========== */
fetch('data.json').then(r=>r.json()).then(d=>{
  renderHero(d); renderStats(d); renderLeaders(d); renderStandings(d);
  renderToday(d); renderYest(d); renderAnalysis(d); renderPlayerTop(d); renderCNPlayers(d);
}).catch(e=>{ document.body.innerHTML='<div class="muted" style="padding:40px;text-align:center">数据加载失败，请稍后重试</div>'; });
</script>
</body>
